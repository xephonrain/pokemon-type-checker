name: ポケモンDB自動更新

on:
  schedule:

  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Step1 - 種族値取得
        run: python collect_pokemon_base.py

      - name: Step2 - 技取得
        run: python collect_pokemon_moves.py

      - name: Step3 - 技DB取得
        run: python collect_move_db.py

      # Step4（使用率）はVPSで実行してpokemon_usage.jsonをプッシュ済みのため不要
      # VPS側: python collect_pokemon_usage.py && python push_usage_to_github.py

      - name: Step5 - DB構築
        run: python build_db.py

      - name: Step6 - HTMLに反映
        run: python apply_db_output.py --html index.html

      - name: Commit and Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "変更なし。スキップします。" && exit 0
          git commit -m "chore: DB自動更新 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST')"
          git push origin HEAD:${{ github.ref_name }}
